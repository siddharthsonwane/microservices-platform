---
# ─── Platform-wide ConfigMap ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  EUREKA_URL:                      "http://admin:admin123@service-discovery:8761/eureka/"
  KAFKA_BOOTSTRAP_SERVERS:         "kafka-headless.kafka.svc.cluster.local:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT:    "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
  REDIS_HOST:                      "redis-master.platform.svc.cluster.local"
  REDIS_PORT:                      "6379"
  SPRING_PROFILES_ACTIVE:          "k8s"
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:InitialRAMPercentage=50.0
    -XX:+UseG1GC
    -XX:+UseStringDeduplication
    -Djava.security.egd=file:/dev/./urandom
---
# ─── Secrets (base64 encoded — use AWS Secrets Manager / Vault in prod) ───────
apiVersion: v1
kind: Secret
metadata:
  name: platform-db-secrets
  namespace: platform
type: Opaque
stringData:
  orders-db-url:      "jdbc:postgresql://postgres-orders:5432/orders_db"
  orders-db-user:     "orders_user"
  orders-db-pass:     "orders_pass"
  payments-db-url:    "jdbc:postgresql://postgres-payments:5432/payments_db"
  payments-db-user:   "payments_user"
  payments-db-pass:   "payments_pass"
  inventory-db-url:   "jdbc:postgresql://postgres-inventory:5432/inventory_db"
  inventory-db-user:  "inventory_user"
  inventory-db-pass:  "inventory_pass"
  saga-db-url:        "jdbc:postgresql://postgres-saga:5432/saga_db"
  saga-db-user:       "saga_user"
  saga-db-pass:       "saga_pass"
---
apiVersion: v1
kind: Secret
metadata:
  name: eureka-credentials
  namespace: platform
type: Opaque
stringData:
  username: "admin"
  password: "admin123"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: platform
type: Opaque
stringData:
  redis-password: ""
