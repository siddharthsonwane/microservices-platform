---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: platform
  labels:
    app: service-discovery
    version: v1
spec:
  replicas: 1   # Eureka HA requires odd number >= 3 in prod; use StatefulSet
  selector:
    matchLabels:
      app: service-discovery
  template:
    metadata:
      labels:
        app: service-discovery
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path:   "/actuator/prometheus"
        prometheus.io/port:   "8761"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      containers:
        - name: service-discovery
          image: ${ECR_REGISTRY}/service-discovery:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: EUREKA_HOST
              value: service-discovery
          resources:
            requests:
              cpu:    200m
              memory: 512Mi
            limits:
              cpu:    "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds:       10
            failureThreshold:    5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 60
            periodSeconds:       15
            failureThreshold:    3
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: platform
  labels:
    app: service-discovery
spec:
  selector:
    app: service-discovery
  ports:
    - name: http
      port:       8761
      targetPort: 8761
  type: ClusterIP
