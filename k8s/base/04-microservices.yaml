# ═══════════════════════════════════════════════════════════════════
# NOTIFICATION SERVICE
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8084"
    spec:
      containers:
        - name: notification-service
          image: ${ECR_REGISTRY}/notification-service:${IMAGE_TAG}
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: platform
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
---
# ═══════════════════════════════════════════════════════════════════
# SAGA ORCHESTRATOR
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  namespace: platform
spec:
  replicas: 1   # Single instance prevents duplicate saga starts; use leader election for HA
  selector:
    matchLabels:
      app: saga-orchestrator
  template:
    metadata:
      labels:
        app: saga-orchestrator
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8085"
    spec:
      terminationGracePeriodSeconds: 60  # Allow in-flight sagas to complete
      containers:
        - name: saga-orchestrator
          image: ${ECR_REGISTRY}/saga-orchestrator:${IMAGE_TAG}
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DB_HOST
              value: "postgres-saga"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: platform-db-secrets
                  key: saga-db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db-secrets
                  key: saga-db-pass
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 1Gi  }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
  namespace: platform
spec:
  selector:
    app: saga-orchestrator
  ports:
    - port: 8085
      targetPort: 8085
---
# ─── PodDisruptionBudgets for all services ────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payment-service
